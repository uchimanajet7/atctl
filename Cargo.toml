[package]
name = "atctl"
version = "0.2.1"
edition = "2024"
rust-version = "1.97"
description = "CLI/TUI AT command controller for USB cellular modems"
license = "MIT"
repository = "https://github.com/uchimanajet7/atctl"
readme = "README.md"
keywords = ["at-command", "modem", "cellular", "tui", "usb"]
categories = ["command-line-utilities"]
include = [
    "/src/**",
    "/examples/presets/**",
    "/examples/sequences/**",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
crossterm = "0.29.0"
portable-pty = "0.9"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
rusb = "0.9.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
unicode-truncate = "3.0.0"
